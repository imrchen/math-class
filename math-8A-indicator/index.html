<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="robots" content="noindex,nofollow">
<meta name="googlebot" content="noindex,nofollow">
  <meta charset="UTF-8" />

  <title>國中數學 八上</title>
  <meta name="description" content="國中數學 八上" />
  <link rel="stylesheet" href="style.css?v=20260924e" />
  <link rel="stylesheet" href="deck-overrides.css?v=20260924e" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']],
        /* \degree：上游 curated 用它寫角度（九上光第 1～3 章就 500 多處）。
           MathJax 沒有內建這個巨集，沒定義的話整份角度會排成**紅色的 `\degree` 原文**
           （2026-09-13 在 1-1 精熟1 的列表列上看到）。 */
        macros: { degree: '^\\circ' }
      },
      svg: { fontCache: 'global' },
      startup: { typeset: false }
    };
  </script>
  <!-- MathJax 改為隨站打包：教室電腦不一定有網路，CDN 掛掉整份公式就不會排版。
       來源 https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js（2026-09-13 取得）。 -->
  <script src="vendor/tex-svg.js?v=20260924e" id="MathJax-script" async></script>
</head>
<body>
  <!-- 封面 -->
  <section id="cover" class="cover">
    <div class="cover-inner">
      <p class="cover-eyebrow">108 課綱國中數學 · 第 3 冊（八上）</p>
      <h1 class="cover-title">八上</h1>
      <p class="cover-sub">乘法公式與多項式 · 平方根與畢氏定理 · 因式分解 · 一元二次方程式 · 統計資料處理與圖表</p>
      <div class="cover-chapters" id="coverChapters"></div>
      <button class="cover-start" id="startBtn">開始複習 →</button>
      <p class="cover-hint">用 ← → 鍵翻頁，或點左側目錄跳章。空白鍵下一頁。</p>
    </div>
  </section>

  <!-- 主體 -->
  <div id="app" class="app hidden">
    <!-- 頂部列 -->
    <header class="topbar">
      <button class="home-btn" id="homeBtn" title="回封面">✦ 八上</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <button class="ghost-btn" id="tocToggle" title="目錄">☰ 目錄</button>
      </div>
    </header>

    <div class="body">
      <!-- 目錄側欄 -->
      <aside class="toc" id="toc"></aside>

      <!-- 舞台 -->
      <main class="stage">
        <div class="slide" id="slide"></div>

        <!-- 底部控制列 -->
        <div class="controlbar">
          <button class="nav-btn" id="prevBtn">‹ 上一頁</button>
          <div class="progress">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">1 / 1</span>
          </div>
          <button class="nav-btn" id="nextBtn">下一頁 ›</button>
        </div>
      </main>
    </div>

    <!-- 授課教具：畫筆畫布、雷射點、浮動工具列 -->
    <canvas id="penCanvas" class="pen-canvas"></canvas>
    <div id="laserDot" class="laser-dot hidden"></div>
    <div id="dock" class="dock">
      <button class="dbtn" id="dkSidebar" title="收合／展開側欄">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
      </button>
      <button class="dbtn" id="dkPrev" title="上一頁 (←)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
      </button>
      <button class="dbtn" id="dkNext" title="下一頁 (→)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
      </button>
      <div class="dsep"></div>
      <button class="dbtn" id="dkLaser" title="雷射筆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="dbtn" id="dkPen" title="畫筆">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <div class="dcolors hidden" id="dkColors">
        <button class="dcolor active" data-c="#e11d48" style="--sc:#e11d48" title="紅"></button>
        <button class="dcolor" data-c="#2563eb" style="--sc:#2563eb" title="藍"></button>
        <button class="dcolor" data-c="#059669" style="--sc:#059669" title="綠"></button>
        <button class="dcolor" data-c="#f59e0b" style="--sc:#f59e0b" title="黃"></button>
        <button class="dcolor" data-c="#111827" style="--sc:#111827" title="黑"></button>
        <button class="dbtn derase" id="dkErase" title="橡皮擦">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l7-7 6 6-4 4H8z"/><line x1="4" y1="21" x2="20" y2="21"/></svg>
        </button>
      </div>
      <button class="dbtn" id="dkClear" title="清除筆跡">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 21 6"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
      </button>
      <div class="dsep"></div>
      <button class="dbtn" id="dkFull" title="全螢幕">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>

  <script src="svg.js?v=20260924e"></script>
  <!-- 逐題詳解：由 scripts/extract_solutions.py 從 ocho 產生，不要手改 -->
  <script src="solutions.js?v=20260924e"></script>
  <!-- 習作／隨堂練習帶圖的題：圖由 scripts/extract_figures.mjs 從 ocho 轉出 -->
  <script src="figures.js?v=20260924e"></script>
  <script>
    /* 練習／檢討元件（practice.js，與八上-課本版共用同一份檔）的站別設定：
       子題列＋藏起來的答案欄、整題一畫面、放大層自己試寬度。accent 由各章 chN.js 以章色覆寫。 */
    window.PRACTICE_CONFIG = {
      site: 'indicator', list: 'item', detail: 'single', zoomFit: 'trial', fitFloor: 0.62,
      theme: { ink: '#172033', grey: '#8a94a6', grn: '#059669', accent: '#2563eb',
               border: '#dce3ee', sub: '#657187', back: '#c3cddd', hover: '#f2f6ff' },
      font: { tag: '11px', tex: '13.5px', text: '13px', ans: '12.5px', go: '16px' },
      srcColors: {}
    };
  </script>
  <!-- 練習頁元件：與八上-課本版逐位元組相同的共用檔 -->
  <script src="practice.js?v=20260924e"></script>
  <script src="ch1.js?v=20260924e"></script>
  <script src="ch2.js?v=20260924e"></script>
  <script src="ch3.js?v=20260924e"></script>
  <script src="ch4.js?v=20260924e"></script>
  <script src="ch5.js?v=20260924e"></script>
  <script src="engine.js?v=20260924e"></script>
  <script>
    /* 目錄第三層：節之內依類別折疊（Roger 2026-09-24：「指標版的習作也加上折疊」）。
       規則由 toc-sections.js 讀（三站同一份），依序比對標題、第一個命中的算數。
       指標版的習作一律收在節末（2026-09-23 定案），對答案頁與 1-2 的精熟思路頁也接在後面，所以歸同一類；
       講解頁與穿插在講解之間的隨堂練習都沒命中，歸「講解與隨堂」。 */
    window.TOC_GROUPS = [
      ['習作', '習作|對答案|思路'],
    ];
    window.TOC_GROUP_REST = '講解與隨堂';
  </script>
  <script src="toc-sections.js?v=20260924e"></script>
  <script src="zoom-mixed.js?v=20260924e"></script>
  <script src="zoom-pan.js?v=20260924e"></script>
  <script src="mathjax-catchup.js?v=20260924e"></script>
</body>
</html>
